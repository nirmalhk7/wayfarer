name: Android APK preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --prefix mobile
      - name: Build the pinned offline Live atlas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-gdal python3-venv
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/atlas-python"
          python="$RUNNER_TEMP/atlas-python/bin/python"
          "$python" -m pip install 'shapely==2.1.2'
          archive="$RUNNER_TEMP/tl_2026_us_county.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "$(jq -er .url tools/tiger2026-county-source.json)" -o "$archive"
          "$python" tools/build-port-atlas.py "$archive" tools/tiger2026-county-source.json "$RUNNER_TEMP/atlas" --workers 2
          WAYFARER_ATLAS_TEST_DATA="$RUNNER_TEMP/atlas/county2026-v2" npm test
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$archive"
          printf '%s  %s\n' '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583' "$archive" | sha256sum -c -
          mkdir -p "$sdk/cmdline-tools"
          unzip -q "$archive" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager exits after reading the final prompt and closes yes's pipe.
          (set +o pipefail; yes | "$sdkmanager" --sdk_root="$sdk" --licenses)
          "$sdkmanager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Assemble and verify the signed preview APK
        env:
          CI: 'true'
          EXPO_OFFLINE: '1'
        run: bash mobile/tools/build-preview-apk.sh "$RUNNER_TEMP/wayfarer-apk" "$RUNNER_TEMP/atlas/county2026-v2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wayfarer-android-preview
          path: ${{ runner.temp }}/wayfarer-apk/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wayfarer-android-preview
          path: ${{ runner.temp }}/wayfarer-apk
      - name: Verify and publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/wayfarer-apk
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          apk=Wayfarer-android-preview.apk
          checksum="$apk.sha256"
          atlas=Wayfarer-county2026-v2.zip
          sha256sum -c "$checksum"
          tag="android-preview-$GITHUB_SHA"
          repo="$GITHUB_REPOSITORY"

          if gh release view "$tag" --repo "$repo" --json isDraft,targetCommitish > release.json 2>/dev/null; then
            # An already published release is immutable from this workflow.
            if jq -e '.isDraft == false' release.json >/dev/null; then
              test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
              gh release download "$tag" --repo "$repo" --pattern "$apk" --pattern "$checksum" --pattern "$atlas" --dir existing
              (cd existing && sha256sum -c "$checksum")
              printf 'Verified existing release: %s/%s/releases/tag/%s\n' "$GITHUB_SERVER_URL" "$repo" "$tag"
              exit 0
            fi
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' release.json >/dev/null
          else
            cat > notes.md <<NOTES
          Android sideload preview built from main commit $GITHUB_SHA by [GitHub Actions]($GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID).

          Download **$apk** and use the SHA-256 file to verify it. The APK includes the full U.S. Live atlas (all 3,144 ports across the 50 states and D.C.) and the Training campaign. Both work without downloading port data. Live requires a fresh on-device location fix. **$atlas** contains the same checked index, geometry tiles and ranked port registry as the APK.

          This release uses the standard public Expo/React Native debug signing key for preview installs. It is not production signing. An existing install signed with a different key must be uninstalled before installing this APK. Uninstalling removes local saves.
          NOTES
            gh release create "$tag" --repo "$repo" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Wayfarer Android preview ${GITHUB_SHA:0:12}" --notes-file notes.md
          fi

          gh release upload "$tag" --repo "$repo" --clobber "$apk" "$checksum" "$atlas"
          # Read back the uploaded assets before publishing the draft.
          gh release download "$tag" --repo "$repo" --pattern "$apk" --pattern "$checksum" --pattern "$atlas" --dir uploaded
          cmp "$checksum" "uploaded/$checksum"
          (cd uploaded && sha256sum -c "$checksum")
          gh release edit "$tag" --repo "$repo" --draft=false --prerelease --latest=false
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease,url \
            --jq 'select(.isDraft == false and .isPrerelease == true).url' | tee -a "$GITHUB_STEP_SUMMARY" | grep '^https://'
